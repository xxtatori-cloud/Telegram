
name: MONOGRAM Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MONOGRAM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;27.2.12479018"
          sdkmanager "cmake;3.22.1"

      - name: Build MONOGRAM APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --no-daemon --stacktrace

      - name: Upload MONOGRAM APK
        uses: actions/upload-artifact@v4
        with:
          name: MONOGRAM-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 7
