
name: MONOGRAM Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MONOGRAM APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verify Android environment
        run: |
          java -version
          sdkmanager --list_installed
          chmod +x gradlew
          ./gradlew --version

      - name: Build MONOGRAM
        run: |
          ./gradlew \
            :TMessagesProj_AppStandalone:assembleAfatDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="TMessagesProj_AppStandalone/build/outputs/apk/afat/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found"
            find TMessagesProj_AppStandalone/build/outputs -type f || true
            exit 1
          fi

          mkdir -p artifacts

          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" \
            -exec cp {} artifacts/ \;

          if ! find artifacts -type f -name "*.apk" | grep -q .; then
            echo "::error::No APK files generated"
            exit 1
          fi

          ls -lh artifacts/

      - name: Upload MONOGRAM APK
        uses: actions/upload-artifact@v4
        with:
          name: MONOGRAM-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
